name: sandcorp-flow-dev
include:
  - path: docker-compose.yml

services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    # uvicorn ASGI + --reload(코드 변경 핫리로드) — async view·SSE를 dev에서도 네이티브로.
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://fake-llm:8090}
      TRY_ALLOWED_ORIGINS: http://localhost:5174  # Vite 프록시가 Host 를 바꾸므로 dev 의 /try 쓰기(#37)
    depends_on:
      fake-llm:
        condition: service_healthy

  worker:
    command: celery -A config.celery worker --loglevel=debug --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://fake-llm:8090}

  # taskiq chat 워커(dev) — chat 코드 변경 시 컨테이너 재시작 필요(taskiq 핫리로드 미사용).
  worker-chat:
    command: taskiq worker config.taskiq_worker:broker --workers 1 --max-async-tasks 10 --log-level DEBUG
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://fake-llm:8090}
    depends_on:
      fake-llm:
        condition: service_healthy

  # ── Event pipeline (dev: 코드 마운트 + dev 설정) — relay+소비자 4개 한 프로세스(#290) ──
  events:
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

  widget:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./widget:/app
      - widget_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  admin:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - ./e2e/tests/narrow-routes.json:/e2e/narrow-routes.json:ro  # 390폭 넘침 e2e 라우트 목록 일치 시험(#90)
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5174:5174"
    depends_on:
      - api

  # 기본 임베딩은 결정적 가짜(fake-llm /v1/embeddings, #260)라 GPU·모델 내려받기 없이 어디서나 뜬다.
  # 낱말이 겹치는 글끼리만 가까운 가짜이므로 의미 검색 품질을 보려면 실제 bge-m3를 켠다:
  #   OLLAMA_BASE_URL=http://ollama:11434 docker compose -f docker-compose.dev.yml --profile ollama up -d
  # GPU(nvidia)가 있으면 `ollama` 서비스에 runtime: nvidia·NVIDIA_VISIBLE_DEVICES=all을 겹쳐 쓴다(기본에는 두지 않는다).
  fake-llm:
    build:
      context: ./fake_llm
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    environment:
      - OLLAMA_FLASH_ATTENTION=0  # GPU flash-attention에서 bge-m3가 NaN 임베딩을 내는 문제 회피
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-init:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [ "pull", "bge-m3" ]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  widget_node_modules:
  admin_node_modules:
  ollama_data:
