# PR 검사(GitHub 호스팅 Actions, #317·#320) — scripts/ci/check.sh 전 단계 + 파괴적 migrate 검사.
# Jenkins `sandcorp-flow-pr` 가 하던 것과 같다(docs/deployment.md 「PR 검사」). sandcorp-authkit 은 공개 저장소에서 git+https 로 받는다.
# 보안: 공개 저장소라 남의 PR 코드가 돈다 — pull_request 만(pull_request_target 금지), GitHub 호스팅 실행기만,
# 읽기 권한만, secrets 를 쓰지 않는다. 액션은 커밋 SHA 로 고정한다(옆 주석이 태그).
name: PR 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ① lint·deploy.sh·runtime-config 시험
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: CHECK_ONLY=lint bash scripts/ci/check.sh

  vitest:
    name: ③ admin·widget vitest + widget typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: CHECK_ONLY=vitest bash scripts/ci/check.sh

  nginx:
    name: ⑤ nginx 계약 시험
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: CHECK_ONLY=nginx bash scripts/ci/check.sh

  migrate:
    name: 파괴적 migrate 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # pull_request 는 머지 커밋을 받는다 — 첫 부모가 기준 브랜치다.
      - run: bash scripts/ci/migrate-guard.sh HEAD^1

  backend:
    name: ② 백엔드 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 빌드 캐시(gha): containerd 이미지 저장소를 켜면 기본 docker 드라이버도 type=gha 캐시를 쓴다(docker-container 빌더는
      # 맞혀도 이미지마다 레이어를 tarball 로 docker 에 보내 e2e 에서 194초가 들었다). bake 가 docker 의 빌드 캐시를 데우면
      # check.sh 의 compose build 가 같은 데몬에서 맞힌다. 저장은 main push 에서만.
      - name: docker containerd 이미지 저장소 켜기
        run: |
          f=/etc/docker/daemon.json
          { [ -s "$f" ] && sudo cat "$f" || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f" && sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}'
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.test.yml
          targets: test,fake-llm
          set: |
            test.cache-from=type=gha,scope=flow-test
            ${{ github.event_name == 'push' && 'test.cache-to=type=gha,scope=flow-test,mode=max' || '' }}
            fake-llm.cache-from=type=gha,scope=flow-fake-llm
            ${{ github.event_name == 'push' && 'fake-llm.cache-to=type=gha,scope=flow-fake-llm,mode=max' || '' }}
      - run: echo "실행기 vCPU=$(nproc)"
      - run: CHECK_ONLY=backend bash scripts/ci/check.sh

  openapi:
    name: ④ OpenAPI·orval 드리프트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 빌드 캐시(gha): containerd 이미지 저장소를 켜면 기본 docker 드라이버도 type=gha 캐시를 쓴다(docker-container 빌더는
      # 맞혀도 이미지마다 레이어를 tarball 로 docker 에 보내 e2e 에서 194초가 들었다). bake 가 docker 의 빌드 캐시를 데우면
      # check.sh 의 compose build 가 같은 데몬에서 맞힌다. 저장은 main push 에서만.
      - name: docker containerd 이미지 저장소 켜기
        run: |
          f=/etc/docker/daemon.json
          { [ -s "$f" ] && sudo cat "$f" || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f" && sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}'
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.test.yml
          targets: test,fake-llm
          set: |
            test.cache-from=type=gha,scope=flow-test
            fake-llm.cache-from=type=gha,scope=flow-fake-llm
      - run: CHECK_ONLY=openapi bash scripts/ci/check.sh

  e2e:
    name: ⑥ e2e(Playwright) ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 실측(4 vCPU, run 42558820929): 나누지 않고 워커 2 = 잡 341초, 워커 4 = 3초 한도 초과 40건,
        # 2조각·워커 2 = 287초·259초로 초과 없음. 실행기마다 스택을 따로 띄운다(이미지는 gha 캐시)
        shard: ['1/3', '2/3', '3/3']
    env:
      E2E_SHARD: ${{ matrix.shard }}
      E2E_WORKERS: 2  # 4 vCPU 에서 4워커면 다수가 3초 한도를 넘었다. 한도는 그대로
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 빌드 캐시(gha): containerd 이미지 저장소를 켜면 기본 docker 드라이버도 type=gha 캐시를 쓴다(docker-container 빌더는
      # 맞혀도 이미지마다 레이어를 tarball 로 docker 에 보내 e2e 에서 194초가 들었다). bake 가 docker 의 빌드 캐시를 데우면
      # check.sh 의 compose build 가 같은 데몬에서 맞힌다. 저장은 main push 에서만.
      - name: docker containerd 이미지 저장소 켜기
        run: |
          f=/etc/docker/daemon.json
          { [ -s "$f" ] && sudo cat "$f" || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f" && sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}'
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.test.yml
          targets: test,fake-llm,api-e2e,admin-e2e,widget-e2e,e2e
          set: |
            test.cache-from=type=gha,scope=flow-test
            fake-llm.cache-from=type=gha,scope=flow-fake-llm
            api-e2e.cache-from=type=gha,scope=flow-backend
            ${{ github.event_name == 'push' && matrix.shard == '1/3' && 'api-e2e.cache-to=type=gha,scope=flow-backend,mode=max' || '' }}
            admin-e2e.cache-from=type=gha,scope=flow-admin-e2e
            ${{ github.event_name == 'push' && matrix.shard == '1/3' && 'admin-e2e.cache-to=type=gha,scope=flow-admin-e2e,mode=max' || '' }}
            widget-e2e.cache-from=type=gha,scope=flow-widget-e2e
            ${{ github.event_name == 'push' && matrix.shard == '1/3' && 'widget-e2e.cache-to=type=gha,scope=flow-widget-e2e,mode=max' || '' }}
            e2e.cache-from=type=gha,scope=flow-e2e
            ${{ github.event_name == 'push' && matrix.shard == '1/3' && 'e2e.cache-to=type=gha,scope=flow-e2e,mode=max' || '' }}
      - run: echo "실행기 vCPU=$(nproc)"
      - run: CHECK_ONLY=e2e bash scripts/ci/check.sh

  build:
    name: vite build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [admin, widget]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - working-directory: ${{ matrix.app }}
        run: npm ci --no-audit --no-fund --loglevel=error && npm run build
