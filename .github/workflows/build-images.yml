# prod 이미지(arm64) 빌드 → GHCR push → oracle(A1) 무중단 배포 (ADR-0015).
#
# sub의 self-hosted 러너 3대(x86)에서 QEMU buildx로 linux/arm64를 빌드해 oracle(Ampere A1)이
# pull만 하게 한다. 빌드 대상은 backend(api·worker·worker-chat·relay·bridge 공용), admin,
# widget 3개 — 매트릭스라 러너 3대에 1:1 분배돼 병렬로 빌드된다(러너가 적으면 자동 큐잉). paddle은 Vision OCR 전환으로 prod에서 제거(ADR-0020), ollama·nginx·pg·redis·
# neo4j는 공식 멀티아치 이미지라 빌드 불필요.
#
# 인증: GITHUB_TOKEN(packages:write) — PAT 불필요. 태그: <git sha>(불변, 배포 핀) + latest(main).
# 트리거는 main push로 한정한다 — 피처 브랜치 푸시가 self-hosted 러너를 태우는 낭비를 막고,
# pull_request가 아니라 push라 fork PR도 러너에서 안 돈다(보안). 배포 자체도 main-only(아래 release).
# CI 설정만 바꾸는 커밋은 메시지에 [skip ci]를 넣어 불필요한 재빌드·재배포를 건너뛴다.
#
# release: main push에서 빌드 성공 후 release 브랜치를 그 SHA로 갱신한다. A1의 Jenkins
# (jenkins.moonpair.org)가 release push 웹훅을 받아 로컬에서 scripts/deploy.sh를 실행해
# docker rollout 무중단 배포한다 — SSH·배포 시크릿 불필요(배포가 호스트 네이티브).

name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

# main에 연속 push가 겹치면 진행 중이던 이전 빌드 run을 취소해 self-hosted 러너 3대를 즉시
# 회수한다(어차피 최신 SHA만 배포). ref별 그룹이라 main과 수동(workflow_dispatch) 실행은 독립적이다.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, arm64-builder]
    strategy:
      fail-fast: false
      # 러너 3대(arm64-builder)에 api·admin·widget 매트릭스가 1:1로 분배돼 병렬로 빌드된다.
      # 러너가 더 적으면 자동으로 큐잉된다(이 값은 동시 실행 상한일 뿐).
      max-parallel: 3
      matrix:
        include:
          - image: api
            context: ./backend
          - image: admin
            context: ./admin
          - image: widget
            context: ./widget
    steps:
      - uses: actions/checkout@v4

      # 호스트 dockerd(DooD)에 arm64 에뮬레이션 등록 + buildx 빌더 준비(매 실행 idempotent).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # api만: backend/requirements.txt의 sandcorp-authkit(비공개 sandcorp-auth)을 git+ssh로 받는다(#282).
      # AUTHKIT_SSH_KEY는 sandcorp-auth 읽기 전용 deploy key의 개인키다. agent에만 넣고 파일로 두지 않는다.
      - name: sandcorp-auth deploy key를 ssh-agent에 넣는다
        if: matrix.image == 'api'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTHKIT_SSH_KEY }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandcorp-flow-${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # api만 agent 소켓을 BuildKit에 넘긴다(Dockerfile의 RUN --mount=type=ssh). admin·widget은 빈 값.
          ssh: ${{ matrix.image == 'api' && 'default' || '' }}
          # 러너 재시작에도 캐시 보존 — GHCR :buildcache 태그에 layer 캐시 저장/재사용.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/sandcorp-flow-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/sandcorp-flow-${{ matrix.image }}:buildcache,mode=max

  # main push에서 3개 이미지 빌드가 모두 성공하면 release 브랜치를 그 SHA로 force-update한다.
  # 이 push가 GitHub 웹훅을 발화 → A1의 Jenkins가 release를 감지해 로컬 배포한다.
  # (GITHUB_TOKEN push는 다른 GH Actions 워크플로우는 재귀 방지로 안 깨우지만, 외부 웹훅(Jenkins)은
  #  정상 발화한다.) release HEAD = 빌드된 SHA = 이미지 태그라 Jenkins가 그대로 쓴다.
  # 추가 시크릿 불필요 — 내장 GITHUB_TOKEN(contents:write)만 쓴다.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    # 비공개 저장소라 GitHub 호스팅 러너(ubuntu-latest)는 과금 대상 — 결제·한도에 막히지 않게 self-hosted에서 돈다.
    # 러너 이미지에 gh가 없을 수 있어 curl로 REST를 직접 부른다.
    runs-on: [self-hosted, arm64-builder]
    permissions:
      contents: write
    steps:
      - name: release 브랜치를 빌드된 SHA로 갱신(웹훅 → Jenkins 배포)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() { curl -fsS -X "$1" "https://api.github.com/repos/$REPO/$2" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -d "$3"; }
          api PATCH git/refs/heads/release "{\"sha\":\"$SHA\",\"force\":true}" >/dev/null \
            || api POST git/refs "{\"ref\":\"refs/heads/release\",\"sha\":\"$SHA\"}" >/dev/null
          echo "release → $SHA"
