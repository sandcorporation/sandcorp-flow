name: sandcorp-flow
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-sandcorp_flow}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Neo4j는 제거됨(ADR-0021) — GraphRAG는 Postgres+pgvector(GraphStore)로 흡수.

  api:
    build:
      context: ./backend
    # uvicorn ASGI(전면 async, ADR-0022) — async ninja view + async SSE generator를 네이티브로
    # 서빙한다. gunicorn gevent 폐기(블로킹-허브 병 원천 제거).
    command: uvicorn config.asgi:application --lifespan off --host 0.0.0.0 --port 8000 --workers 4
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A config.celery worker --loglevel=info
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 인터랙티브 chat 전용 taskiq 워커(ADR-0024) — taskiq redis 큐에서 chat_task를 소비한다.
  # 노드가 async라 한 이벤트루프가 동시 다수 chat을 IO 대기 중 yield하며 처리(--max-async-tasks).
  # 무거운 배치(Celery worker)와 프로세스가 분리돼 chat이 굶지 않는다. 처리량은 replica로 확장.
  worker-chat:
    build:
      context: ./backend
    command: taskiq worker config.taskiq_worker:broker --workers 2 --max-async-tasks 25
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Event pipeline (Transactional Outbox + EventBus) ─────────────────────────
  # relay + 소비자 그룹 4개(webhook·visitor/console/presence-bridge)를 한 프로세스의 스레드로 돌린다
  # (#290, docs/event-pipeline.md). relay는 outbox 순서 보존을 위해 단일 인스턴스여야 하므로 이
  # 서비스는 replica 1개로 고정한다(스케일 금지). 한 그룹이 죽으면 그 그룹만 백오프 후 다시 뜬다.
  # 부하가 커진 그룹은 `run_event_pipeline --exclude=<group>` + `consume_events --group=<group>`
  # 서비스로 떼어낸다(소비자만 replica 확장 가능).
  events:
    build:
      context: ./backend
    command: python manage.py run_event_pipeline
    env_file: .env
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # OCR은 per-Tenant Vision Provider로 수행한다(PRD-vision-ocr) — Paddle 서비스는 dev/test에서도
  # 제거됐다(ADR-0020 보충). 별도 OCR 컨테이너 없음.

volumes:
  postgres_data:
  redis_data:
