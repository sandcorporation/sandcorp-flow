[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = tests
markers =
    real_embedding: 실제 Ollama bge-m3를 부르는 시험(수동). 기본 실행에서는 빠진다. TEST_REAL_EMBEDDING=1 bash scripts/test.sh
addopts = -m "not real_embedding"
