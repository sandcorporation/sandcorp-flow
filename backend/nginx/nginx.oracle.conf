# oracle(A1) prod용 nginx — NPM(Nginx Proxy Manager) 뒤에서 앱 내부 라우팅 + SPA 서빙 담당.
# 공개 TLS/도메인은 NPM이 종단하고, NPM이 <A1 호스트>:${NGINX_PORT}(compose의 호스트 포트)로 포워딩한다.
#
# 핵심: api를 정적 upstream이 아니라 **동적 resolver + 변수 proxy_pass**로 프록시한다 —
# `docker rollout`으로 api 컨테이너 IP가 바뀌어도 reload 없이 ~5s 내 수렴한다(정적 upstream은
# 시작 시 1회만 DNS 캐시해 롤아웃 후 옛 IP로 깨진다).
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # site.webmanifest 가 octet-stream 으로 나가던 것을 바로잡는다(#142 관찰, #154).
    types {
        application/manifest+json webmanifest;
    }

    # 방문 지표 스니펫(#154): $flow_metrics_head 를 env(METRICS_SNIPPET_URL)에서 만든다. 템플릿 설명 참조.
    include /etc/nginx/conf.d/flow-metrics.conf;

    # 접근 로그(#185): 기본 combined 줄 끝에 요청 총시간(rt)과 업스트림 응답시간(urt)을 덧붙인다.
    # 앞부분은 combined 와 같아 기존 파서가 깨지지 않는다. 정적 응답은 urt=-.
    # 업스트림 재시도·여러 서버면 urt 는 "0.001, 0.250" 처럼 쉼표로 이어진다.
    log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log timed;

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Docker 임베디드 DNS. valid=5s로 짧게 재해석 → 롤아웃 후 새 api IP로 빠르게 수렴.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # NPM이 종단한 원 프로토콜(https)을 보존해 api로 전달한다. NPM→우리 nginx는 http라
    # $scheme로 덮어쓰면 https 정보를 잃어 request.is_secure()가 거짓이 된다.
    # 위젯 주소의 frame-ancestors(#248). 정책 엔드포인트가 답하지 못해 값이 비면 "*"(fail-open — 도입 전과 같다).
    map $embed_policy $embed_frame_ancestors {
        ""      "*";
        default $embed_policy;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;

        # SSE — 버퍼링 끄고 길게 유지. 변수 proxy_pass라 매 연결 시 api를 재해석.
        location /api/chat/stream {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 3600s;
            proxy_next_upstream error timeout http_502;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # 시험 대화 SSE(#253) — 편집기 시험 /api/tenant/flows/{id}/test/ 와 /try 시험 /api/try/flows/{id}/test/.
        # LLM 호출이 길어도 끊기지 않게 read timeout만 늘린다(앱이 15초마다 SSE 주석 하트비트를 보낸다). 운영 턴 경로와 별개.
        location ~ ^/api/(tenant|try)/flows/[^/]+/test/$ {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout http_502;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/ {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;
            proxy_next_upstream error timeout http_502;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # MCP 서버(#74) — Streamable HTTP JSON 응답 모드(POST 한 번에 JSON 한 답, 세션·SSE 없음).
        location = /mcp {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;
            client_max_body_size 2m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # MCP 리소스(aud …/mcp)의 경로별 보호 리소스 메타데이터 — /mcp 401의 resource_metadata가 가리킨다.
        location = /.well-known/oauth-protected-resource/mcp {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # sandcorp-auth 보호 리소스 메타데이터(RFC 9728, #20) — 401의 resource_metadata가 가리킨다.
        location = /.well-known/oauth-protected-resource {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Visitor 위젯 SPA (widget_dist 볼륨)
        location = /embed {
            return 301 /embed/;
        }
        location /embed/ {
            alias /app/widget/;
            try_files $uri /embed/index.html;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        # 공개 챗봇 URL — Visitor 위젯 SPA를 서빙한다(slug는 위젯이 pathname에서 파싱).
        # 위젯 base가 /embed/라, slug 경로에서 index.html을 폴백 서빙해도 자산은 /embed/assets/…로
        # 로드된다. 한글 slug(percent-encoded 포함)도 /chatbot/ prefix로 매칭된다.
        # 허용 사이트(#248, ADR-0034): 앱의 정책 엔드포인트에 auth_request로 물어 frame-ancestors 를 붙인다.
        # 폴백은 /embed/ 로 내부 이동하지 않고 같은 위치 안(@chatbot_index)에서 낸다 — 이동하면 /embed/ 의 헤더가 붙는다.
        location /chatbot/ {
            auth_request /_internal/embed-policy;
            auth_request_set $embed_policy $upstream_http_x_frame_ancestors;
            alias /app/widget/;
            try_files $uri @chatbot_index;
            add_header Content-Security-Policy "frame-ancestors $embed_frame_ancestors" always;
        }
        location @chatbot_index {
            root /app/widget;
            rewrite ^ /index.html break;
            add_header Content-Security-Policy "frame-ancestors $embed_frame_ancestors" always;
        }
        # 정책 하위 요청 — internal 이라 바깥(NPM)에서 부르면 404. 앱 경로도 /api/ 밖이라 /api/ 위치로는 닿지 않는다.
        # 판정은 $request_uri(쿼리·퍼센트 인코딩 그대로, try_files 로 바뀌지 않음)로 한다(#179 주석과 같은 까닭).
        # 실패하면 열어 둔다(fail-open): 앱 재시작·롤아웃·5xx·시간 초과·이름 해석 실패는 모두 @embed_policy_open 의 204(값 없음)가 되고,
        # 값이 비면 아래 map 이 "*"(도입 전과 같다)로 바꾼다. auth_request 는 2xx/401/403 밖을 500 으로 만들므로 여기서 다 삼킨다.
        location = /_internal/embed-policy {
            internal;
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api/_internal/embed-policy;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_send_timeout 1s;
            proxy_read_timeout 2s;
            proxy_intercept_errors on;
            error_page 400 401 403 404 405 500 502 503 504 = @embed_policy_open;
        }
        location @embed_policy_open {
            # 바깥에서 /_internal/… 을 직접 부르면 internal 의 404 도 여기로 온다 — 하위 요청($request_uri 는 /chatbot/…)만 204.
            if ($request_uri ~ "^/_internal/") {
                return 404;
            }
            return 204;
        }

        # 어드민 SPA (admin_dist 볼륨)
        location = /admin-ui {
            return 301 /admin-ui/;
        }
        location /admin-ui/ {
            alias /app/admin/;
            try_files $uri /admin-ui/index.html;
            add_header Content-Security-Policy "frame-ancestors $flow_frame_ancestors" always;
            sub_filter '</head>' '$flow_metrics_head</head>';
            sub_filter_once on;
        }

        # 짧은 주소(#165) — portfolio 등 바깥이 거는 계약 주소. SPA 는 basename /admin-ui 아래에서만 돌고
        # (자산·라우터·sub_filter 지표가 모두 거기 있다) 같은 index.html 을 다른 경로에 또 서빙하면 경로가 둘이 되므로,
        # 정적 페이지가 아닌 **301 로 /admin-ui 아래로** 보낸다. $request_uri 라 쿼리·퍼센트 인코딩이 그대로 간다.
        # absolute_redirect off: NPM 이 TLS 를 종단해 이 nginx 는 http:80 이라 절대 URL 이면 Location 이 http://호스트(https 가 아님)가
        # 된다 — 상대 Location 으로 내려 브라우저가 https 출처에서 풀게 한다.
        # 지표 스니펫은 도착한 /admin-ui/ 페이지에 한 번 붙는다(301 응답엔 본문이 없다).
        # 정확히 /try, /try/ 와 /flows/ 접두만 — /tryout·/flowsX 는 걸리지 않는다.
        location = /try {
            absolute_redirect off;
            return 301 /admin-ui$request_uri;
        }
        location = /try/ {
            absolute_redirect off;
            return 301 /admin-ui/try$is_args$args;
        }
        location ^~ /flows/ {
            absolute_redirect off;
            return 301 /admin-ui$request_uri;
        }

        # 공개 랜딩 페이지 (widget 멀티페이지 빌드의 landing.html을 루트에 서빙). 자산은
        # /embed/assets/ (base /embed)라 위 /embed/ location이 처리한다.
        location = / {
            root /app/widget;
            try_files /landing.html =404;
            add_header Content-Security-Policy "frame-ancestors $flow_frame_ancestors" always;
            sub_filter '</head>' '$flow_metrics_head</head>';
            sub_filter_once on;
        }
        # 검색 등록(#286). robots.txt·sitemap.xml 은 정적 문자열이라 nginx 가 직접 낸다(widget 빌드·이미지 재빌드 없이 conf 만 바뀐다).
        # CSP·지표 스니펫(sub_filter)은 붙이지 않는다. 운영 도메인은 flow.sandcorp.co.kr 하나라 sitemap 의 절대 URL 을 고정한다.
        # 공개 경로를 더하거나 빼면 아래 두 곳(robots 의 Allow/Disallow, sitemap 의 url)과 README 를 함께 고친다.
        # Allow 가 Disallow 보다 길면(가장 긴 일치가 이긴다) 예외가 된다: 체험 화면과, 공개 페이지가 그리는 데 쓰는 자산.
        location = /robots.txt {
            default_type text/plain;
            charset utf-8;
            return 200 "User-agent: *
Allow: /
Allow: /admin-ui/try
Allow: /admin-ui/assets/
Allow: /admin-ui/flow/
Allow: /embed/assets/
Allow: /embed/flow/
Disallow: /admin-ui/
Disallow: /embed
Disallow: /chatbot/
Disallow: /api/
Disallow: /mcp
Disallow: /.well-known/
Disallow: /_internal/
Disallow: /flows/

Sitemap: https://flow.sandcorp.co.kr/sitemap.xml
";
        }
        location = /sitemap.xml {
            # mime.types 가 .xml 을 text/xml 로 매기므로 이 location 에서만 types 를 비워 default_type 이 이기게 한다.
            types { }
            default_type application/xml;
            charset utf-8;
            return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>https://flow.sandcorp.co.kr/</loc></url>
  <url><loc>https://flow.sandcorp.co.kr/admin-ui/try</loc></url>
  <url><loc>https://flow.sandcorp.co.kr/privacy</loc></url>
  <url><loc>https://flow.sandcorp.co.kr/terms</loc></url>
</urlset>
';
        }
        # 루트 /favicon.ico (브라우저가 링크 없이도 요청, 크롤러·메일). widget public/favicon.ico → dist 루트. (#142)
        location = /favicon.ico {
            root /app/widget;
            try_files /favicon.ico =404;
            expires 7d;
        }
        # 약관·개인정보처리방침(정보통신망법) — widget 멀티페이지의 정적 페이지.
        location = /privacy {
            root /app/widget;
            try_files /privacy.html =404;
            add_header Content-Security-Policy "frame-ancestors $flow_frame_ancestors" always;
            sub_filter '</head>' '$flow_metrics_head</head>';
            sub_filter_once on;
        }
        location = /terms {
            root /app/widget;
            try_files /terms.html =404;
            add_header Content-Security-Policy "frame-ancestors $flow_frame_ancestors" always;
            sub_filter '</head>' '$flow_metrics_head</head>';
            sub_filter_once on;
        }
    }
}
