events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    upstream api {
        server api:8000;
    }

    # 위젯 주소의 frame-ancestors(#248, ADR-0034). 정책 엔드포인트가 답하지 못해 값이 비면 "*"(fail-open).
    map $embed_policy $embed_frame_ancestors {
        ""      "*";
        default $embed_policy;
    }

    server {
        listen 80;

        # SSE — disable buffering
        location /api/chat/stream {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 시험 대화 SSE(#253) — 편집기 시험 /api/tenant/flows/{id}/test/ 와 /try 시험 /api/try/flows/{id}/test/.
        # LLM 호출이 길어도 끊기지 않게 read timeout만 늘린다(앱이 15초마다 SSE 주석 하트비트를 보낸다).
        location ~ ^/api/(tenant|try)/flows/[^/]+/test/$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # MCP 서버(#74)와 그 보호 리소스 메타데이터
        location = /mcp {
            proxy_pass http://api;
            client_max_body_size 2m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # sandcorp-auth 보호 리소스 메타데이터(RFC 9728, #20)
        location = /.well-known/oauth-protected-resource {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # 루트 /favicon.ico (브라우저가 링크 없이도 요청, 크롤러·메일). widget public/favicon.ico → dist 루트. (#142)
        location = /favicon.ico {
            root /app/widget;
            try_files /favicon.ico =404;
            expires 7d;
        }

        location = /embed {
            return 301 /embed/;
        }

        location /embed/ {
            alias /app/widget/;
            try_files $uri /embed/index.html;
        }

        # 공개 챗봇 URL(#248) — 운영 nginx.oracle.conf 와 같은 auth_request 정책. 설명은 그쪽 주석.
        location /chatbot/ {
            auth_request /_internal/embed-policy;
            auth_request_set $embed_policy $upstream_http_x_frame_ancestors;
            alias /app/widget/;
            try_files $uri @chatbot_index;
            add_header Content-Security-Policy "frame-ancestors $embed_frame_ancestors" always;
        }

        location @chatbot_index {
            root /app/widget;
            rewrite ^ /index.html break;
            add_header Content-Security-Policy "frame-ancestors $embed_frame_ancestors" always;
        }

        location = /_internal/embed-policy {
            internal;
            proxy_pass http://api/_internal/embed-policy;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_send_timeout 1s;
            proxy_read_timeout 2s;
            proxy_intercept_errors on;
            error_page 400 401 403 404 405 500 502 503 504 = @embed_policy_open;
        }

        location @embed_policy_open {
            # 바깥에서 /_internal/… 을 직접 부르면 internal 의 404 도 여기로 온다 — 하위 요청($request_uri 는 /chatbot/…)만 204.
            if ($request_uri ~ "^/_internal/") {
                return 404;
            }
            return 204;
        }

        location = /admin-ui {
            return 301 /admin-ui/;
        }

        location /admin-ui/ {
            alias /app/admin/;
            try_files $uri /admin-ui/index.html;
        }
    }
}
