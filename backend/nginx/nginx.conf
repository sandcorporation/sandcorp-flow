events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;

        # SSE — disable buffering
        location /api/chat/stream {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 시험 대화 SSE(#253) — 편집기 시험 /api/tenant/flows/{id}/test/ 와 /try 시험 /api/try/flows/{id}/test/.
        # LLM 호출이 길어도 끊기지 않게 read timeout만 늘린다(앱이 15초마다 SSE 주석 하트비트를 보낸다).
        location ~ ^/api/(tenant|try)/flows/[^/]+/test/$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # MCP 서버(#74)와 그 보호 리소스 메타데이터
        location = /mcp {
            proxy_pass http://api;
            client_max_body_size 2m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # sandcorp-auth 보호 리소스 메타데이터(RFC 9728, #20)
        location = /.well-known/oauth-protected-resource {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # 루트 /favicon.ico (브라우저가 링크 없이도 요청, 크롤러·메일). widget public/favicon.ico → dist 루트. (#142)
        location = /favicon.ico {
            root /app/widget;
            try_files /favicon.ico =404;
            expires 7d;
        }

        location = /embed {
            return 301 /embed/;
        }

        location /embed/ {
            alias /app/widget/;
            try_files $uri /embed/index.html;
        }

        location = /admin-ui {
            return 301 /admin-ui/;
        }

        location /admin-ui/ {
            alias /app/admin/;
            try_files $uri /admin-ui/index.html;
        }
    }
}
