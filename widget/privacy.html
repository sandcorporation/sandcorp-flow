<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>개인정보처리방침 — Sandcorp Flow</title>
    <meta name="color-scheme" content="light dark" />
    <!-- 아이콘·favicon 자리: #142 에서 채운다. -->
    <script>
      // 저장된 수동 테마를 첫 그림 전에 적용(깜박임 방지). 키·값은 ThemeToggle 과 같다.
      try { var t = localStorage.getItem('admin_theme'); if (t) document.documentElement.classList.add(t === 'dark' ? 'dark' : 'light') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/privacy-main.tsx"></script>
  </body>
</html>
