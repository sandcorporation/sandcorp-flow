# oracle(Ampere A1, arm64, GPU 없음) prod 배포 — GHCR 이미지를 pull만 한다(빌드 안 함).
# GitHub Actions가 이미지를 빌드하고 Jenkins 잡 sandcorp-flow는 production 승격 이미지만 oracle에 배포한다(ADR-0037).
#
# - 모든 backend 서비스(api·worker·worker-chat·events)는 같은 sandcorp-flow-api 이미지.
#   events = relay + 소비자 그룹 4개를 한 프로세스로(#290). replica 1개 고정(relay 단일 인스턴스).
# - 공개 TLS/도메인은 NPM(Nginx Proxy Manager)이 종단 → 공유 `proxy` 네트워크로 이 스택의 nginx
#   (별칭 sandcorp-flow-web:80)에 포워딩. 그래서 nginx는 호스트 포트를 열지 않는다.
# - 무중단: api·worker·worker-chat만 `docker rollout`(start-first). db·redis·nginx는 싱글톤.
# - ollama·paddle 없음(per-Tenant Provider/Vision OCR). collectstatic 없음(STATIC_ROOT 미사용).
#
# 사전 준비(A1): `docker network create proxy` (NPM과 공유), .env, GHCR login(read:packages).
# 이미지 태그: deploy.sh가 IMAGE_TAG=<git-sha>로 핀(롤백 = 옛 sha 재실행).

x-backend: &backend
  image: ghcr.io/sandcorporation/sandcorp-flow-api:${IMAGE_TAG:-latest}
  env_file: .env
  # 오류 수집(GlitchTip, #308). DSN 은 운영 .env 의 SENTRY_DSN_BACKEND(비면 SDK 꺼짐), release 는 배포 커밋 sha 40자
  # (deploy.sh 가 IMAGE_TAG 로 넘기는 이미지 태그 = sandcorpDeploy 의 GIT_COMMIT).
  environment:
    SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
    SENTRY_RELEASE: ${IMAGE_TAG:-}
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

name: sandcorp-flow-prod

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-sandcorp_flow}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # 메모리 상한 안에서 도는 값 — shared_buffers 128MB(기본), 연결은 앱 프로세스 합(~15)에 여유를 둔 60.
    command: postgres -c shared_buffers=128MB -c max_connections=60 -c work_mem=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    # 브로커·스트림·레이트리밋 저장소라 evict하면 작업이 사라진다 → noeviction(가득 차면 쓰기 오류로 드러낸다).
    command: redis-server --maxmemory 192mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    <<: *backend
    # uvicorn ASGI(전면 async, ADR-0022). A1 메모리 제약상 워커 2(async라 워커당 동시 다수 SSE 처리).
    # --lifespan off: Django ASGI는 lifespan을 거절하며 ValueError를 오류 로그로 남긴다(GlitchTip 115, #310). lifespan은 쓰지 않는다.
    command: uvicorn config.asgi:application --lifespan off --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\" || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    <<: *backend
    # 기본 concurrency=호스트 코어 수(A1 4)라 자식 4개가 상주한다 → 2로 고정(배치는 인입 몇 건뿐인 베타).
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    volumes:
      - media:/app/media
    # 배치 드레인 — grace를 넘겨 SIGKILL돼도 재배달로 유실 0이 되려면 backend가 acks_late=True여야
    # 한다(ADR-0015 Q4, 멱등성 감사 후속). 지금은 60s 드레인 여유만 둔다.
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 768M

  worker-chat:
    <<: *backend
    # taskiq chat 워커(ADR-0024). ListQueueBroker는 pop=소비라 재배달 없음(at-most-once,
    # 비멱등 스트리밍 중복 응답 방지). async라 워커 2 × 동시 25면 충분.
    command: taskiq worker config.taskiq_worker:broker --workers 2 --max-async-tasks 25
    volumes:
      - media:/app/media
    # 진행 중 응답(LLM ~30s)을 마치고 종료하도록 충분히 드레인(SIGTERM 후 신규 수신 중단·완료 대기).
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # relay + 소비자 4개(webhook·visitor/console/presence-bridge)를 한 Django 프로세스로(#290).
  # 따로 돌 땐 5개 × ~100MiB(각자 Django 한 벌)였다. relay는 outbox 순서 때문에 단일 인스턴스 —
  # 이 서비스는 절대 스케일하지 않는다(replica 1, docker rollout 대상 아님). 그룹 떼어내기는
  # docs/event-pipeline.md.
  events:
    <<: *backend
    command: python manage.py run_event_pipeline
    stop_grace_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  # 정적 SPA 빌드 산출물을 볼륨에 복사하고 종료(one-shot). nginx가 그 볼륨을 서빙.
  widget-init:
    image: ghcr.io/sandcorporation/sandcorp-flow-widget:${IMAGE_TAG:-latest}
    # 시작할 때 이 env 로 runtime-config.js 를 쓴다(runtime-config.sh, #308) — 빌드에 박지 않는다.
    environment:
      SENTRY_DSN: ${SENTRY_DSN_WIDGET:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
      LANDING_TEL: ${LANDING_TEL:-}   # 랜딩 푸터·처리방침 전화(#326). 비면 줄 숨김
    volumes:
      - widget_dist:/output
    restart: "no"

  admin-init:
    image: ghcr.io/sandcorporation/sandcorp-flow-admin:${IMAGE_TAG:-latest}
    # 시작할 때 이 env 로 runtime-config.js 를 쓴다(runtime-config.sh, #308) — 빌드에 박지 않는다.
    environment:
      SENTRY_DSN: ${SENTRY_DSN_ADMIN:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
    volumes:
      - admin_dist:/output
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    # 호스트 포트로 노출 → NPM이 <A1 호스트>:${NGINX_PORT}로 포워딩한다(공유 네트워크 불필요).
    # 이 포트는 Oracle 보안목록에 열지 말 것 — 같은 호스트의 NPM만 접근한다.
    ports:
      - "172.17.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend/nginx/nginx.oracle.conf:/etc/nginx/nginx.conf:ro
      # 방문 지표 스니펫(#154): 공식 이미지가 시작 때 envsubst 로 conf.d/flow-metrics.conf 를 만든다.
      - ./backend/nginx/flow-metrics.conf.template:/etc/nginx/templates/flow-metrics.conf.template:ro
      - widget_dist:/app/widget:ro
      - admin_dist:/app/admin:ro
    environment:
      NGINX_ENVSUBST_FILTER: "^(METRICS_|TRY_EMBED_)"
      METRICS_SNIPPET_URL: ${METRICS_SNIPPET_URL:-}
      METRICS_SITE_KEY: ${METRICS_SITE_KEY:-flow}
      # /admin-ui/try 를 iframe 으로 허용할 출처(공백 구분, #179). 비면 'self' 만.
      TRY_EMBED_ORIGINS: ${TRY_EMBED_ORIGINS:-}
    depends_on:
      widget-init:
        condition: service_completed_successfully
      admin-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  widget_dist:
  admin_dist:
  media:
