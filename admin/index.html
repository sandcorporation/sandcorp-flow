<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandcorp Flow Admin</title>
    <!-- 글꼴: 시안과 같은 Google Fonts. display=swap이라 글꼴이 늦어도 글자는 먼저 그려진다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <script>
      // 로그인 화면에는 테마 토글이 없다 — 고른 테마를 첫 페인트 전에 적용한다(ThemeToggle과 같은 키).
      try { if (localStorage.getItem('admin_theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
