<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandcorp Flow Admin</title>
    <meta name="description" content="상담을 노드와 선으로 그리고, 시험 대화로 확인합니다. 가입 없이 템플릿을 고쳐 보고 체험할 수 있습니다." />
    <!-- 링크 공유 카드(#186): 정적 head라 og:url·canonical 은 없다. 이미지는 절대 URL(크롤러용)이라 vite 가 base 를 붙이지 않는다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sandcorp Flow" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Sandcorp Flow 체험 — 가입 없이 상담 챗봇 고쳐 보기" />
    <meta property="og:description" content="상담을 노드와 선으로 그리고, 시험 대화로 확인합니다. 가입 없이 템플릿을 고쳐 보고 체험할 수 있습니다." />
    <meta property="og:image" content="https://flow.sandcorp.co.kr/admin-ui/flow/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sandcorp Flow 체험 — 가입 없이 상담 챗봇 고쳐 보기" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sandcorp Flow 체험 — 가입 없이 상담 챗봇 고쳐 보기" />
    <meta name="twitter:description" content="상담을 노드와 선으로 그리고, 시험 대화로 확인합니다. 가입 없이 템플릿을 고쳐 보고 체험할 수 있습니다." />
    <meta name="twitter:image" content="https://flow.sandcorp.co.kr/admin-ui/flow/og.png" />
    <link rel="icon" href="/flow/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/flow/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/flow/apple-touch-icon.png" />
    <link rel="manifest" href="/flow/site.webmanifest" />
    <!-- 글꼴: 시안과 같은 Google Fonts. display=swap이라 글꼴이 늦어도 글자는 먼저 그려진다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <script>
      // 로그인 화면에는 테마 토글이 없다 — 고른 테마를 첫 페인트 전에 적용한다(ThemeToggle과 같은 키).
      try { if (localStorage.getItem('admin_theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
