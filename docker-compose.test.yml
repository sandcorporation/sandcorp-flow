name: sandcorp-flow-test
services:
  # ── 공용 인프라 ──────────────────────────────────────────────────────────
  # 임베딩은 기본이 결정적 가짜(fake-llm /v1/embeddings, #260)라 ollama는 기본 실행에 뜨지 않는다.
  # 실제 bge-m3를 쓰는 real_embedding 마커 시험만 profile `real-embedding`으로 띄운다(TEST_REAL_EMBEDDING=1 bash scripts/test.sh).
  ollama-test:
    image: ollama/ollama
    profiles: ["real-embedding"]
    environment:
      - OLLAMA_FLASH_ATTENTION=0
    volumes:
      - ollama_test_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-test-init:
    image: ollama/ollama
    profiles: ["real-embedding"]
    volumes:
      - ollama_test_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama-test:11434
    entrypoint: ["/bin/sh", "-c"]
    # chat LLM은 fake-llm으로 대체됐고 단위 테스트도 LLM을 fake하므로 임베딩(bge-m3)만 받는다
    command: ["ollama pull bge-m3"]
    depends_on:
      ollama-test:
        condition: service_healthy
    restart: "no"

  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sandcorp_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OCR 서비스 없음 — OCR은 테넌트 Vision Provider 하나(ADR-0020 보충). 시험은 transcribe_image Fake.

  # Neo4j는 제거됨(ADR-0021) — GraphRAG는 Postgres+pgvector(db-test)로 흡수.

  # ── E2E용 결정적 Fake LLM (OpenAI 호환) ─────────────────────────────────────
  fake-llm:
    build:
      context: ./fake_llm
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 백엔드 단위/통합 테스트 ───────────────────────────────────────────────
  test:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
      dockerfile: Dockerfile.test
    command: python -m pytest tests/ -v --tb=short
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db-test
      DB_NAME: sandcorp_flow
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis-test:6379/0
      SECRET_KEY: test-secret-key-not-for-production
      OPEN_ROUTER_BASE_URL: http://fake-llm:8090/v1
      OPEN_ROUTER_API_KEY: fake
      OPEN_ROUTER_DEFAULT_MODEL: fake-llm
      # 플랫폼 기본 임베딩 = fake-llm의 결정적 가짜(#260). 실제 bge-m3는 real_embedding 마커 시험만 REAL_OLLAMA_BASE_URL로 부른다.
      OLLAMA_BASE_URL: http://fake-llm:8090
      REAL_OLLAMA_BASE_URL: http://ollama-test:11434
    depends_on:
      fake-llm:
        condition: service_healthy
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  # ── E2E용 Django API ─────────────────────────────────────────────────────
  api-e2e:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_e2e_operator --token-file /e2e-shared/operator_token &&
             python manage.py seed_e2e_member --token-file /e2e-shared/member_token &&
             (python manage.py seed_e2e_member --sub m_E2EINVITEE0000000000000001 --name 'E2E 초대받은 사람' --email e2e-invitee@example.com --accept-invite-from /e2e-shared/invite_token --token-file /e2e-shared/invitee_token &) &&
             (python manage.py seed_e2e_member --token-file /dev/null --issue-tickets-to /e2e-shared/onboarding_ticket &) &&
             (python manage.py seed_e2e_member --token-file /dev/null --serve-tenants-from /e2e-shared/tenant_requests &) &&
             uvicorn $${E2E_ASGI_APP:-config.asgi:application} --host 0.0.0.0 --port 8000 --workers $${E2E_API_WORKERS:-2}"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db-test
      DB_NAME: sandcorp_flow
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis-test:6379/0
      SECRET_KEY: e2e-secret-key-not-for-production
      OPEN_ROUTER_BASE_URL: http://fake-llm:8090/v1
      OPEN_ROUTER_API_KEY: fake
      OPEN_ROUTER_DEFAULT_MODEL: fake-llm
      OLLAMA_BASE_URL: http://fake-llm:8090  # 결정적 가짜 임베딩(#260)
      # flow.flowtest.test 는 임베드 e2e(#181)의 flow 호스트 별칭.
      # Vite 프록시(changeOrigin)가 Host 를 api-e2e:8000 으로 바꾸므로 브라우저 Origin(admin-e2e)을 허용해야 /api/try 쓰기가 통한다(#37). 운영 검사는 그대로.
      TRY_ALLOWED_ORIGINS: http://admin-e2e:5174,http://localhost:5174,http://flow.flowtest.test:5174
      # e2e는 브라우저가 모두 같은 IP다 — /try 고쳐 보기 스펙(try-flow·try-phone·try-claim ×3)이 하루 3세션 한도를 넘는다(#42). 한도 자체는 백엔드 시험 몫.
      TRY_SESSIONS_PER_IP_PER_DAY: "50"
      E2E_API_WORKERS: ${E2E_API_WORKERS:-2}  # uvicorn 워커 수(#280 실측으로 고른 기본값). 명령의 $${E2E_API_WORKERS}가 이 값을 읽는다
    volumes:
      - media-e2e:/app/media
      - e2e-shared:/e2e-shared  # seed_e2e_operator·seed_e2e_member가 세션 토큰을 쓴다(#21·#56)
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      fake-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/.well-known/oauth-protected-resource || true"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── E2E용 Admin UI ───────────────────────────────────────────────────────
  admin-e2e:
    build:
      context: ./admin
      dockerfile: Dockerfile.e2e
    environment:
      VITE_PROXY_TARGET: http://api-e2e:8000
    depends_on:
      - api-e2e
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5174/ || true"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── E2E용 Widget UI ──────────────────────────────────────────────────────
  widget-e2e:
    build:
      context: ./widget
      dockerfile: Dockerfile.e2e
    environment:
      VITE_PROXY_TARGET: http://api-e2e:8000
    depends_on:
      - api-e2e
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || true"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── E2E용 Celery Worker(배치 전담) ────────────────────────────────────────
  # chat은 taskiq(chat-worker-e2e)로 분리됐다 — 여기선 기본 큐(ingest/OCR/community 등)만 소비.
  worker-e2e:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
    command: celery -A config worker --loglevel=info
    environment: &worker-e2e-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db-test
      DB_NAME: sandcorp_flow
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis-test:6379/0
      SECRET_KEY: e2e-secret-key-not-for-production
      OPEN_ROUTER_BASE_URL: http://fake-llm:8090/v1
      OPEN_ROUTER_API_KEY: fake
      OPEN_ROUTER_DEFAULT_MODEL: fake-llm
      OLLAMA_BASE_URL: http://fake-llm:8090  # 결정적 가짜 임베딩(#260)
    volumes:
      - media-e2e:/app/media
    depends_on:
      api-e2e:
        condition: service_healthy
      fake-llm:
        condition: service_healthy

  # ── E2E용 taskiq chat 워커 ────────────────────────────────────────────────
  # send_message가 dispatch한 chat_task(taskiq redis 큐)를 실제로 실행한다 — 없으면 chat이 멈춘다.
  chat-worker-e2e:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
    command: taskiq worker config.taskiq_worker:broker --workers 1 --max-async-tasks 10
    environment: *worker-e2e-env
    volumes:
      - media-e2e:/app/media
    depends_on:
      api-e2e:
        condition: service_healthy
      fake-llm:
        condition: service_healthy

  # ── E2E용 Event pipeline (relay + 소비자) ────────────────────────────────
  relay-e2e:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
    command: python manage.py relay
    environment: &event-pipeline-e2e-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db-test
      DB_NAME: sandcorp_flow
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis-test:6379/0
      SECRET_KEY: e2e-secret-key-not-for-production
    depends_on:
      api-e2e:
        condition: service_healthy

  worker-webhook-e2e:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
    command: python manage.py consume_events --group=webhook
    environment: *event-pipeline-e2e-env
    depends_on:
      api-e2e:
        condition: service_healthy

  worker-visitor-bridge-e2e:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
    command: python manage.py consume_events --group=visitor-bridge
    environment: *event-pipeline-e2e-env
    depends_on:
      api-e2e:
        condition: service_healthy

  worker-console-bridge-e2e:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
    command: python manage.py consume_events --group=console-bridge
    environment: *event-pipeline-e2e-env
    depends_on:
      api-e2e:
        condition: service_healthy

  worker-presence-bridge-e2e:
    build:
      context: ./backend
      ssh: [default]  # sandcorp-authkit(비공개 sandcorp-auth)를 git+ssh로 받는다
    command: python manage.py consume_events --group=presence-bridge --topic=signals.presence
    environment: *event-pipeline-e2e-env
    depends_on:
      api-e2e:
        condition: service_healthy

  # ── 운영 nginx(nginx.oracle.conf) — 위젯 주소의 동적 frame-ancestors e2e(#248) ─────
  # 운영 설정을 그대로 올리고 api 이름을 api-e2e 로 잇는다(links 별칭 — 동적 resolver 가 푼다). 위젯 본문은 작은 고정 페이지다
  # (CSP 헤더와 iframe 막힘만 본다 — 위젯 동작은 widget-e2e 가 본다).
  nginx-e2e:
    image: nginx:1.27-alpine
    links:
      - "api-e2e:api"
    environment:
      NGINX_ENVSUBST_FILTER: "^(METRICS_|TRY_EMBED_)"
      METRICS_SNIPPET_URL: ""
      METRICS_SITE_KEY: flow
      TRY_EMBED_ORIGINS: ""
    volumes:
      - ./backend/nginx/nginx.oracle.conf:/etc/nginx/nginx.conf:ro
      - ./backend/nginx/flow-metrics.conf.template:/etc/nginx/templates/flow-metrics.conf.template:ro
      - ./e2e/fixtures/nginx-widget:/app/widget:ro
      - ./e2e/fixtures/nginx-widget:/app/admin:ro
    depends_on:
      api-e2e:
        condition: service_healthy

  # ── Playwright E2E 테스트 러너 ───────────────────────────────────────────
  e2e:
    build:
      context: ./e2e
    environment:
      ADMIN_URL: http://admin-e2e:5174
      WIDGET_URL: http://widget-e2e:5173
      API_URL: http://api-e2e:8000
      NGINX_URL: http://nginx-e2e
      E2E_OPERATOR_TOKEN_FILE: /e2e-shared/operator_token
      E2E_SHARED_DIR: /e2e-shared
    volumes:
      - e2e-shared:/e2e-shared  # 초대 원문(invite_token)을 써서 수락 대역에 넘긴다(#56)
    depends_on:
      api-e2e:
        condition: service_healthy
      admin-e2e:
        condition: service_healthy
      widget-e2e:
        condition: service_healthy
      nginx-e2e:
        condition: service_started
      worker-e2e:
        condition: service_started
      chat-worker-e2e:  # 챗 답변은 taskiq 워커가 만든다 — 없으면 위젯이 답을 못 받는다(#65)
        condition: service_started
      relay-e2e:
        condition: service_started
      worker-webhook-e2e:
        condition: service_started
      worker-visitor-bridge-e2e:
        condition: service_started
      worker-console-bridge-e2e:
        condition: service_started
      worker-presence-bridge-e2e:
        condition: service_started

volumes:
  ollama_test_data:
  media-e2e:
  e2e-shared:
